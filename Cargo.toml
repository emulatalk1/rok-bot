[package]
name = "rok-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "macOS automation for Rise of Kingdoms — v0.1.8 in-process ScreenCaptureKit (Mode 1 + Mode 2)"
license = "MIT"
publish = false
# v0.1.8 hard-requires macOS 14.0+. SCScreenshotManager (the in-process
# capture API that replaces the v0.1.x screencapture CLI shellout) is
# new in macOS 14. Pre-14 systems surface the requirement at boot
# through `permissions::check_sck_grant` returning
# `CaptureFailed { stage: "no_shareable_content" }`.

[profile.release]
# Required for v0.2 Drop guards to run on panic. Harmless in v0.1 (no Drop guards yet).
panic = "unwind"

[dependencies]
core-graphics      = "0.25"
core-foundation    = "0.10"
objc2              = "0.6"
# objc2-foundation: NSString (legacy v0.1.x bundle-ID lookup, now driven
# off SCRunningApplication.bundleIdentifier instead) + NSArray and
# NSError for SCK enumeration + completion-handler error paths.
objc2-foundation   = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSError"] }
# v0.1.8 SCK in-process capture (replaces v0.1.x /usr/sbin/screencapture
# CLI shellout). All five crates spike-validated at version 0.3.x in
# spikes/p8-spike/Cargo.toml; feature sets transferred verbatim.
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "SCStream", "SCShareableContent", "SCScreenshotManager", "block2", "objc2-core-graphics", "objc2-core-foundation", "libc"] }
objc2-core-graphics      = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGDataProvider", "CGColorSpace", "CGGeometry"] }
objc2-core-foundation    = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
block2                   = "0.6"
dispatch2                = "0.3"
# libc: O_NOFOLLOW + symlink-safe file open in src/capture.rs (closes
# the v0.1.x→v0.1.8 symlink TOCTOU between the pre-check and the PNG
# write). Already a transitive dep via objc2-screen-capture-kit's
# libc feature; declared here to make the dependency contract explicit.
libc                     = "0.2"
thiserror          = "2"
anyhow             = "1"
# ctrlc: v0.2 continuous loop. Installs a SIGINT handler that flips an
# AtomicBool checked at tick boundaries — Ctrl-C finishes the current
# tick (including the in-flight click pair) and exits 0 instead of
# hard-killing the process mid-click and stranding a LeftMouseDown.
# This is what lets the ClickGuard RAII in click.rs be panic-only.
ctrlc              = "3"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# image + imageproc: v0.1.2 template-matching pipeline. `image` is already
# a transitive dep of imageproc; pinning it directly locks the feature set
# (PNG decode only — no JPEG/GIF/TIFF/etc bloat). `imageproc`'s rayon
# feature unlocks `match_template_parallel` for the ~4-8x speedup on M-series.
image              = { version = "0.25", default-features = false, features = ["png"] }
imageproc          = { version = "0.26", default-features = false, features = ["rayon"] }

[dev-dependencies]
# Round-trip tests for matcher::find_target write a haystack PNG to a tempfile,
# match it back, and verify error paths via missing/corrupt files. tempfile
# handles the tmpdir lifecycle so leaked test artifacts don't pollute /tmp.
tempfile           = "3"

[lints.rust]
# Downgraded from forbid (mbrain) to deny: window.rs needs unsafe for CGWindowList FFI.
unsafe_code                   = "deny"
unsafe_op_in_unsafe_fn        = "deny"
# Allowed for v0.1 personal project; flip to warn at v0.2 when public surface stabilizes.
missing_docs                  = "allow"
missing_debug_implementations = "warn"
# Binary crate: no external consumers, so "unreachable pub" is noise.
unreachable_pub               = "allow"
unused_lifetimes              = "warn"
unused_macro_rules            = "warn"
unused_qualifications         = "warn"
single_use_lifetimes          = "warn"
trivial_casts                 = "warn"
trivial_numeric_casts         = "warn"
let_underscore_drop           = "warn"
non_ascii_idents              = "warn"
macro_use_extern_crate        = "warn"

keyword_idents      = { level = "warn", priority = -1 }
rust_2018_idioms    = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style   = { level = "warn", priority = -1 }

[lints.clippy]
all      = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }

# Anti-AI-slop restriction lints
unwrap_used                = "warn"
expect_used                = "warn"
panic                      = "warn"
todo                       = "warn"
unimplemented              = "warn"
dbg_macro                  = "warn"
print_stdout               = "warn"
print_stderr               = "warn"
unreachable                = "warn"
exit                       = "warn"
mem_forget                 = "warn"
indexing_slicing           = "warn"
get_unwrap                 = "warn"
string_slice               = "warn"
str_to_string              = "warn"
string_to_string           = "warn"
clone_on_ref_ptr           = "warn"
rc_buffer                  = "warn"
rc_mutex                   = "warn"
float_cmp_const            = "warn"
lossy_float_literal        = "warn"
multiple_inherent_impl     = "warn"
verbose_file_reads         = "warn"
mod_module_files           = "warn"
arithmetic_side_effects        = "warn"
renamed_function_params        = "warn"
unchecked_duration_subtraction = "warn"

# Noisy lints every strict shop disables
module_name_repetitions  = { level = "allow", priority = 1 }
must_use_candidate       = { level = "allow", priority = 1 }
missing_errors_doc       = { level = "allow", priority = 1 }
missing_panics_doc       = { level = "allow", priority = 1 }
return_self_not_must_use = { level = "allow", priority = 1 }
similar_names            = { level = "allow", priority = 1 }
too_many_lines           = { level = "allow", priority = 1 }
type_complexity          = { level = "allow", priority = 1 }
cast_precision_loss      = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_sign_loss           = { level = "allow", priority = 1 }

# Binary crate — transitive deps owned by upstream
multiple_crate_versions = { level = "allow", priority = 1 }
cargo_common_metadata   = { level = "allow", priority = 1 }
