[package]
name = "rok-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "macOS automation for Rise of Kingdoms — v0.1 Mode 1 (visible) only"
license = "MIT"
publish = false

[profile.release]
# Required for v0.2 Drop guards to run on panic. Harmless in v0.1 (no Drop guards yet).
panic = "unwind"

[dependencies]
core-graphics      = "0.25"
core-foundation    = "0.10"
# objc2-app-kit + objc2-foundation: NSRunningApplication for bundle-ID
# spoof check on the RoK window owner. Trimmed to just the
# NSRunningApplication feature to keep the dependency surface small.
objc2-app-kit      = { version = "0.3", default-features = false, features = ["NSRunningApplication", "libc"] }
objc2-foundation   = { version = "0.3", default-features = false, features = ["NSString"] }
thiserror          = "2"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
# Downgraded from forbid (mbrain) to deny: window.rs needs unsafe for CGWindowList FFI.
unsafe_code                   = "deny"
unsafe_op_in_unsafe_fn        = "deny"
# Allowed for v0.1 personal project; flip to warn at v0.2 when public surface stabilizes.
missing_docs                  = "allow"
missing_debug_implementations = "warn"
# Binary crate: no external consumers, so "unreachable pub" is noise.
unreachable_pub               = "allow"
unused_lifetimes              = "warn"
unused_macro_rules            = "warn"
unused_qualifications         = "warn"
single_use_lifetimes          = "warn"
trivial_casts                 = "warn"
trivial_numeric_casts         = "warn"
let_underscore_drop           = "warn"
non_ascii_idents              = "warn"
macro_use_extern_crate        = "warn"

keyword_idents      = { level = "warn", priority = -1 }
rust_2018_idioms    = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style   = { level = "warn", priority = -1 }

[lints.clippy]
all      = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }

# Anti-AI-slop restriction lints
unwrap_used                = "warn"
expect_used                = "warn"
panic                      = "warn"
todo                       = "warn"
unimplemented              = "warn"
dbg_macro                  = "warn"
print_stdout               = "warn"
print_stderr               = "warn"
unreachable                = "warn"
exit                       = "warn"
mem_forget                 = "warn"
indexing_slicing           = "warn"
get_unwrap                 = "warn"
string_slice               = "warn"
str_to_string              = "warn"
string_to_string           = "warn"
clone_on_ref_ptr           = "warn"
rc_buffer                  = "warn"
rc_mutex                   = "warn"
float_cmp_const            = "warn"
lossy_float_literal        = "warn"
multiple_inherent_impl     = "warn"
verbose_file_reads         = "warn"
mod_module_files           = "warn"
arithmetic_side_effects        = "warn"
renamed_function_params        = "warn"
unchecked_duration_subtraction = "warn"

# Noisy lints every strict shop disables
module_name_repetitions  = { level = "allow", priority = 1 }
must_use_candidate       = { level = "allow", priority = 1 }
missing_errors_doc       = { level = "allow", priority = 1 }
missing_panics_doc       = { level = "allow", priority = 1 }
return_self_not_must_use = { level = "allow", priority = 1 }
similar_names            = { level = "allow", priority = 1 }
too_many_lines           = { level = "allow", priority = 1 }
type_complexity          = { level = "allow", priority = 1 }
cast_precision_loss      = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_sign_loss           = { level = "allow", priority = 1 }

# Binary crate — transitive deps owned by upstream
multiple_crate_versions = { level = "allow", priority = 1 }
cargo_common_metadata   = { level = "allow", priority = 1 }
